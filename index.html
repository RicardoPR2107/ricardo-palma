<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ricardo A. Palma · Desarrollador Full Stack</title>
    <meta
      name="description"
      content="Portafolio de Ricardo A. Palma, Bachiller en Ingeniería de Sistemas y Desarrollador Full Stack con React.js, Node.js y Express.js."
    />
    <meta name="theme-color" content="#F2F1EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />

    <!-- Vista previa al compartir el enlace (LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ricardo A. Palma · Desarrollador Full Stack" />
    <meta
      property="og:description"
      content="Soluciones web con React.js, Node.js y Express.js, con testing funcional y automatización."
    />
    <meta property="og:url" content="https://ricardoapalma.vercel.app/" />
    <meta property="og:image" content="https://ricardoapalma.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon-rp.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Aplica el tema antes de pintar la página para evitar un parpadeo -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
